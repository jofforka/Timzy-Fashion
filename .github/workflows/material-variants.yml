name: Material variants checks
on:
  pull_request:
    paths:
      - 'assets/js/**'
      - 'assets/img/materials/**'
      - 'admin/**'
      - 'data/material-variants.draft.json'
      - 'tests/**'
      - 'firestore.rules'
      - '.github/workflows/material-variants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node --check assets/js/app.js && node --check assets/js/product-purchase.js && node --check admin/admin.js
      - run: node --test tests/*.test.cjs
      - run: npm ci --prefix tests/spark-rules --no-audit --no-fund
      - run: tests/spark-rules/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify admin and storefront against Firestore Emulator
        run: tests/spark-rules/node_modules/.bin/firebase emulators:exec --project demo-timzy-spark --only firestore "node tests/spark-rules/material-browser.cjs"
