name: Spark owner security
on:
  pull_request:
    paths:
      - 'firestore*.rules'
      - 'admin/**'
      - 'assets/js/admin.js'
      - 'assets/js/app.js'
      - 'tests/spark-rules/**'
      - '.github/workflows/spark-security.yml'
permissions:
  contents: read
jobs:
  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix tests/spark-rules --no-audit --no-fund
      - run: tests/spark-rules/node_modules/.bin/firebase emulators:exec --project demo-timzy-spark --only firestore "node tests/spark-rules/test.cjs"
