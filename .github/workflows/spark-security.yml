name: Spark three-role security
on:
  pull_request:
    paths:
      - 'firestore*.rules'
      - 'admin/**'
      - 'assets/js/admin.js'
      - 'assets/js/app.js'
      - 'tests/spark-rules/**'
      - 'tests/role-portals.test.cjs'
      - '.github/workflows/spark-security.yml'
permissions:
  contents: read
jobs:
  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests/spark-rules --no-audit --no-fund
      - run: node --check admin/admin.js && node --check admin/spark-roles.js && node tests/role-portals.test.cjs
      - run: tests/spark-rules/node_modules/.bin/firebase emulators:exec --project demo-timzy-spark --only firestore "node tests/spark-rules/test.cjs"
