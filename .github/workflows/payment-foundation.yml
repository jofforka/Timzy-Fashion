name: Payment foundation tests
on:
  pull_request:
    paths:
      - 'payments/**'
      - '.github/workflows/payment-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'payments/**'
      - '.github/workflows/payment-foundation.yml'
permissions:
  contents: read
jobs:
  payment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test payment security primitives
        run: node --test payments/payment-core.test.cjs
