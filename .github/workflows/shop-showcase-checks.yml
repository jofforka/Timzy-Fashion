name: Timzy shop regression checks
on:
  pull_request:
    paths:
      - 'shop.html'
      - 'checkout.html'
      - 'assets/js/app.js'
      - 'assets/js/shop-showcase.js'
      - 'assets/js/storefront-preview.js'
      - 'assets/js/storefront-ui.js'
      - 'assets/css/storefront-ui.css'
      - 'index.html'
      - 'catalog.html'
      - 'build-your-look.html'
      - 'build-your-style.html'
      - 'training.html'
      - 'contact.html'
      - 'login.html'
      - 'product.html'
      - 'assets/js/product-purchase.js'
      - 'assets/css/product-purchase.css'
      - 'admin/index.html'
      - 'admin/admin.js'
      - 'assets/css/shop-showcase.css'
      - 'assets/js/config.js'
      - 'data/products.json'
      - 'tests/shop-showcase.test.cjs'
      - 'tests/storefront-preview.test.cjs'
      - 'tests/public-ui.test.cjs'
      - '.github/workflows/shop-showcase-checks.yml'

permissions:
  contents: read

jobs:
  shop-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test shop and checkout
        run: |
          node tests/shop-showcase.test.cjs
          node tests/storefront-preview.test.cjs
          node tests/public-ui.test.cjs
