name: Timzy backend roles and finance safety
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore-rules-v5.rules'
      - 'firebase.json'
      - 'functions/**'
      - 'tests/firebase-rules/**'
      - 'admin/index.html'
      - 'admin/admin.js'
      - 'admin/role-portal.js'
      - 'admin/role-portal.css'
      - 'assets/js/firebase.js'
      - 'assets/js/app.js'
      - 'assets/js/product-purchase.js'
      - 'assets/js/shop-showcase.js'
      - 'tests/role-backend.test.cjs'
      - 'tests/role-security.test.cjs'
      - '.github/workflows/backend-security-checks.yml'
permissions:
  contents: read
jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check functions/index.js
          node --check functions/lib/finance.js
          node --check functions/lib/catalog-audit.js
          node --check functions/scripts/audit-public-products.js
          node --check functions/scripts/bootstrap-superadmin.js
          node --check admin/admin.js
          node --check admin/role-portal.js
          node --check assets/js/firebase.js
      - name: Finance calculations and callable integration
        run: |
          node --test functions/tests/finance.test.cjs
          node --test functions/tests/catalog-audit.test.cjs
          node tests/role-backend.test.cjs
          node tests/role-security.test.cjs
      - name: Install real Firebase callable dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Load callable exports with actual Firebase SDK
        run: |
          node -e "const a = require('./functions/index.js'); const names = ['recordSale','provisionUser','setAccountActive','saveInvestorAgreement','markInvestorPayout']; for (const name of names) { if (typeof a[name] !== 'function') process.exit(1) }; console.log('PASS: Real Firebase callable exports loaded.')"


  firestore-rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated rules test dependencies
        run: npm install --prefix tests/firebase-rules --no-audit --no-fund
      - name: Test real Firebase role restrictions with Firestore Emulator
        run: tests/firebase-rules/node_modules/.bin/firebase emulators:exec --project demo-timzy-role-security --only firestore "node tests/firebase-rules/test.cjs"
